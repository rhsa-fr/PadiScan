<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradasi Daun Padi -->
    <linearGradient id="leafGrad" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#00652C"/>
      <stop offset="45%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>

    <!-- Gradasi Daun Sekunder -->
    <linearGradient id="leafSecGrad" x1="20%" y1="80%" x2="70%" y2="25%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <!-- Gradasi Nodus Emas AI -->
    <radialGradient id="goldNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </radialGradient>

    <!-- Gradasi Scanner Glow -->
    <linearGradient id="laserGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4ADE80" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A7F3D0" stop-opacity="1"/>
      <stop offset="70%" stop-color="#4ADE80" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Lingkaran Reticle Scanner Luar -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#15803D" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="14 10" />
  
  <!-- Busur Reticle Sudut Cyber / L-bracket -->
  <!-- Kiri Atas -->
  <path d="M 110 180 L 110 120 A 10 10 0 0 1 120 110 L 180 110" fill="none" stroke="#22C55E" stroke-width="8" stroke-linecap="round" />
  <!-- Kanan Atas -->
  <path d="M 332 110 L 392 110 A 10 10 0 0 1 402 120 L 402 180" fill="none" stroke="#22C55E" stroke-width="8" stroke-linecap="round" />
  <!-- Kiri Bawah -->
  <path d="M 110 332 L 110 392 A 10 10 0 0 0 120 402 L 180 402" fill="none" stroke="#22C55E" stroke-width="8" stroke-linecap="round" />
  <!-- Kanan Bawah -->
  <path d="M 332 402 L 392 402 A 10 10 0 0 0 402 392 L 402 332" fill="none" stroke="#22C55E" stroke-width="8" stroke-linecap="round" />

  <!-- 2. Daun Sekunder (Helai Daun Muda di Belakang) -->
  <path d="M 190 380 C 180 290 230 190 320 145 C 275 220 260 295 190 380 Z" fill="url(#leafSecGrad)" opacity="0.65" />

  <!-- 3. Daun Utama Padi (Lengkungan Elegan Organis) -->
  <path d="M 145 395 C 130 240 235 110 405 95 C 330 220 285 330 145 395 Z" fill="url(#leafGrad)" />

  <!-- 4. Tulang Daun Utama (Clean Minimalist White Rib) -->
  <path d="M 165 375 Q 260 240 385 115" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-opacity="0.85" />

  <!-- 5. Garis Laser Scanner Animatif (Horizontal Beam) -->
  <rect x="95" y="246" width="322" height="6" rx="3" fill="url(#laserGrad)" filter="url(#neonGlow)" />

  <!-- 6. Nodus Digital AI & Bulir Padi Emas (Pucuk Daun) -->
  <!-- Outer Pulse Ring -->
  <circle cx="405" cy="95" r="32" fill="none" stroke="#FACC15" stroke-width="4" stroke-opacity="0.45" stroke-dasharray="6 6" />
  <!-- Node Core -->
  <circle cx="405" cy="95" r="18" fill="url(#goldNode)" filter="url(#neonGlow)" />
  <!-- Center Specular Highlight -->
  <circle cx="400" cy="90" r="5" fill="#FFFFFF" opacity="0.9" />

  <!-- 7. Satelit Nodus Data AI Kecil -->
  <line x1="385" y1="115" x2="340" y2="155" stroke="#4ADE80" stroke-width="3" stroke-dasharray="4 4" stroke-opacity="0.7" />
  <circle cx="340" cy="155" r="6" fill="#4ADE80" />
  
  <line x1="260" y1="240" x2="225" y2="215" stroke="#4ADE80" stroke-width="3" stroke-dasharray="4 4" stroke-opacity="0.7" />
  <circle cx="225" cy="215" r="5" fill="#86EFAC" />
</svg>